; Steam Multiplayer settings. Changes take effect the next time the game starts.

[Background]
; 1 = the game keeps running when its window is not focused or is being dragged
;     (needed for online races). Keys and controllers are ignored while another
;     window has focus.
; 0 = original behaviour: the game pauses when it loses focus.
RunWhenUnfocused=1

[Menus]
; 1 = the Multiplayer tile opens the online menus (Play with Everyone / Play with Friends).
; 0 = the game's own menus: Multiplayer goes straight to Local Split Screen.
Enabled=1
; The consoles' triangle / Y button: INVITE FRIENDS in the lobby, VIEW PROFILE on the online game list.
; Its key picture (an "A" cap) comes with this mod (also over Metal Sonic's version of those menu
; files). Another key still works but the footer keeps showing the A cap. Same key names as the
; voice chat's Key below.
InviteKey=A

[Race]
; 1 = when you host, your game drives the computer racers for everyone, so they are
;     in the same places on every screen (as on the consoles).
; 0 = each game drives its own computer racers (they differ between the screens).
HostRunsAI=1
; 1 = when you host (with HostRunsAI=1), every player's items and All-Star moves show
;     on every screen: each car's own game decides what it picks up, fires and is hit by.
; 0 = each game only shows its own player's items.
ItemSync=1

[Voice]
; Voice chat with the other players in your lobby (through Steam, as the consoles' party chat).
; Mode: ptt  = push-to-talk: hold the Key below to talk (the default)
;       open = open microphone while you are in a lobby or a race
;       off  = no voice chat (nothing is sent or heard)
Mode=ptt
; The push-to-talk key: a letter or digit, F1..F24, SPACE, TAB, CTRL, SHIFT, ALT, CAPSLOCK, or a
; virtual-key number. It works only while the game window is in front and the Steam overlay is closed.
Key=V
; How loud the others are, in percent (0-300; above 100 makes quiet microphones louder).
Volume=100
; Players you don't want to hear: their Steam IDs (the 17-digit numbers), separated by commas.
Muted=

[Update]
; 1 = at game start, the mod checks GitHub (github.com/Demaunix/all-stars-reconnected) once for a newer
;     release. If there is one, it downloads it, checks the author's signature and every file, and keeps it
;     ready in <game>\mods-updates; at the NEXT game start ChaoGarage (1.3.0 or newer) puts it in place
;     (your config.ini is kept). With an older ChaoGarage it only logs that a new version is out. Everyone
;     in a lobby needs the same version, so this keeps you able to join. It sends nothing about you; GitHub
;     sees your IP address, as with any download. It only ever changes this mod's folder and mods-updates.
; 0 = never check; update by hand from the mod's GameBanana page.
Auto=1
